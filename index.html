<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERP دفتر دَست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #342D73; --navy-light: #4a4193; --bg: #f5f5fa; --surface: #ffffff;
    --text: #1a1a2e; --muted: #6b6b80; --border: #e2e2ec;
    --success: #1f8a5a; --warn: #b8860b; --danger: #c0392b; --radius: 12px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Vazirmatn','Segoe UI',Tahoma,sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--navy); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header .status { font-size: 12px; opacity: 0.85; }
  nav { display: flex; gap: 6px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 999px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  nav button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .stat .num { font-size: 26px; font-weight: 800; color: var(--navy-light); }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 0; }
  .btn { background: var(--navy); color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--navy-light); border: 1px solid var(--navy-light); }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.big { font-size: 18px; padding: 16px 32px; }
  .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .row input, .row select { flex: 1; min-width: 130px; }
  .pipeline { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .stage-col { min-width: 220px; flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .stage-col h3 { font-size: 13px; margin: 0 0 10px; color: var(--muted); display: flex; justify-content: space-between; }
  .lead-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .lead-card .name { font-weight: 700; margin-bottom: 4px; }
  .lead-card .meta { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .lead-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { display: inline-block; background: rgba(52,45,115,0.1); color: var(--navy-light); border-radius: 999px; padding: 2px 8px; font-size: 11px; margin-inline-end: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .score { font-weight: 700; } .score.high { color: var(--success); } .score.mid { color: var(--warn); } .score.low { color: var(--danger); }
  input, select, textarea { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  .hidden { display: none !important; }
  .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; }
  .status-new { background: #dbeafe; color: #1e40af; }
  .status-progress { background: #fef3c7; color: #92400e; }
  .status-done { background: #d1fae5; color: #065f46; }
  #login-screen { max-width: 360px; margin: 80px auto; text-align: center; }
  #login-screen input { width: 100%; margin-bottom: 10px; }
  #login-screen button { width: 100%; }
  .error-msg { color: #dc2626; font-size: 13px; margin-top: 8px; }
  .counter { font-size: 40px; font-weight: bold; text-align: center; margin: 20px 0; color: var(--navy-light); }
  .user-badge { font-size: 12px; opacity: 0.85; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; margin-bottom: 14px; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal select { width: 100%; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
</style>
</head>
<body>

<div id="login-screen" class="card">
  <h1>ورود به پنل دفتر</h1>
  <input type="text" id="login-username" placeholder="نام کاربری">
  <input type="password" id="login-password" placeholder="رمز عبور">
  <button class="btn" style="width:100%;" onclick="doLogin()">ورود</button>
  <div id="login-error" class="error-msg"></div>
</div>

<div id="app-root" class="hidden">
  <header>
    <div>
      <h1>ERP دفتر دَست</h1>
      <div class="user-badge" id="user-badge"></div>
    </div>
    <div>
      <button class="btn secondary hidden" id="calendar-btn" onclick="window.location.href='/api/auth/login'" style="color:#fff;border-color:#fff;">اتصال به گوگل کلندر</button>
      <button class="btn secondary" onclick="doLogout()" style="color:#fff;border-color:#fff;">خروج</button>
    </div>
  </header>

  <nav id="top-nav"></nav>

  <main>
    <div id="section-attendance" class="hidden"></div>
    <div id="section-tasks" class="hidden"></div>
    <div id="section-dashboard" class="hidden"></div>
    <div id="section-pipeline" class="hidden"></div>
    <div id="section-clients" class="hidden"></div>
    <div id="section-projects" class="hidden"></div>
    <div id="section-contracts" class="hidden"></div>
    <div id="section-office-tasks" class="hidden"></div>
    <div id="section-team" class="hidden"></div>
    <div id="section-erp-tasks" class="hidden"></div>
    <div id="section-costs" class="hidden"></div>
    <div id="section-tenders" class="hidden"></div>
  </main>
</div>

<div id="edit-modal-root"></div>

<script src="app.js"></script>
</body>
</html>
