<body>
<div id="login-screen"><div class="login-shell"><aside class="login-brand"><img src="/icons/apple-touch-icon.png" alt=""><h2>دفتر دَست</h2><p>پروژه‌ها، کارفرمایان، قراردادها و تیم؛ همه در یک پنل.</p><ul class="login-points"><li>ثبت ورود و خروج با یک کلیک یا QR</li><li>کارها و ددلاین‌ها روی تقویم شمسی</li><li>پیگیری سرنخ تا قرارداد و وصول مطالبات</li></ul></aside><form class="login-card" id="login-form" onsubmit="handleLoginSubmit(event)" novalidate><h1>ورود به پنل دفتر</h1><p class="login-sub">با نام کاربری و رمزی که مدیر دفتر برایت ساخته وارد شو.</p><label for="login-username">نام کاربری</label><input type="text" id="login-username" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required><label for="login-password">رمز عبور</label><div class="pw-field"><input type="password" id="login-password" name="password" autocomplete="current-password" dir="ltr" required><button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePasswordVisibility()" aria-label="نمایش رمز">نمایش</button></div><div id="login-error" class="error-msg" role="alert" aria-live="polite"></div><button type="submit" class="btn login-submit" id="login-submit">ورود</button><button type="button" class="login-link" onclick="showForgotPassword()">رمز عبورم را فراموش کرده‌ام</button></form></div></div>
<div id="app-root" class="hidden"><header><div><h1>ERP دفتر دَست</h1><div class="user-badge" id="user-badge"></div></div><div><button class="btn secondary hidden" id="calendar-btn" onclick="connectCalendar()" style="color:#fff;border-color:#fff;">اتصال به گوگل کلندر</button><button class="btn secondary hidden" id="install-btn" onclick="installApp()" style="color:#fff;border-color:#fff;">📲 نصب اپ</button><button class="btn secondary hidden" id="dark-btn" onclick="toggleDarkMode()" style="color:#fff;border-color:#fff;">🌙 حالت تیره</button><button class="btn secondary hidden" id="notif-btn" onclick="enableNotifications()" style="color:#fff;border-color:#fff;">🔔 فعال‌سازی اعلان</button><button class="btn secondary notification-bell" id="notification-btn" onclick="openNotificationCenter()" style="color:#fff;border-color:#fff;" aria-label="اعلان‌ها">🔔<span id="notif-count" class="notif-count hidden">۰</span></button><button class="btn secondary" id="search-btn" onclick="openGlobalSearch()" style="color:#fff;border-color:#fff;">⌕ جستجو</button><button class="btn secondary" onclick="changeMyPassword()" style="color:#fff;border-color:#fff;">🔐 تغییر رمز</button><button class="btn secondary" onclick="doLogout()" style="color:#fff;border-color:#fff;">خروج</button></div></header><nav id="top-nav"></nav><main><div id="section-attendance" class="hidden"></div><div id="section-calendar" class="hidden"></div><div id="section-tasks" class="hidden"></div><div id="section-dashboard" class="hidden"></div><div id="section-pipeline" class="hidden"></div><div id="section-clients" class="hidden"></div><div id="section-projects" class="hidden"></div><div id="section-contracts" class="hidden"></div><div id="section-office-tasks" class="hidden"></div><div id="section-team" class="hidden"></div><div id="section-erp-tasks" class="hidden"></div><div id="section-costs" class="hidden"></div><div id="section-tenders" class="hidden"></div></main></div>
<div id="edit-modal-root"></div><div id="global-search-root"></div>
<script src="app.js"></script>
<script src="qr-security.js"></script>
<script>
  if (localStorage.getItem('dast-dark') === '1') document.body.classList.add('dark');
  async function handleLoginSubmit(e){e.preventDefault();const u=document.getElementById('login-username'),p=document.getElementById('login-password'),err=document.getElementById('login-error'),btn=document.getElementById('login-submit');err.innerText='';if(!u.value.trim()||!p.value){err.innerText='نام کاربری و رمز عبور را وارد کن.';(u.value.trim()?p:u).focus();return}btn.disabled=true;btn.innerText='در حال ورود...';try{await doLogin()}catch(_){err.innerText='اتصال برقرار نشد، دوباره تلاش کن.'}finally{btn.disabled=false;btn.innerText='ورود';if(err.innerText)p.select();else p.value=''}}
  function togglePasswordVisibility(){const p=document.getElementById('login-password'),b=document.getElementById('pw-toggle'),show=p.type==='password';p.type=show?'text':'password';b.innerText=show?'پنهان':'نمایش';b.setAttribute('aria-label',show?'پنهان کردن رمز':'نمایش رمز');p.focus()}
</script>
</body>
</html>
